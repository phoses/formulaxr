[/Script/Engine.RendererSettings]
; Proven passthrough setup from handletest (docs/plan.md §7): deferred renderer + TSR.
; Lumen is off: the scene is small and mixed reality has no virtual walls to bounce light from.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=1
; Phase 7 perf pass at Quest 3 stereo pixel count (~9 Mpx), RTX 4070: TSR cost ~8 ms and SSAO ~4 ms
; of a 15.4 ms GPU frame. TAA + no SSAO: 3.3 ms. (Virtual shadows and SSR cost almost nothing here.)
r.AntiAliasingMethod=2
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
; Empty pixels keep alpha 0 so the Quest passthrough underlay shows through them.
r.PostProcessing.PropagateAlpha=True
r.DefaultFeature.AutoExposure=False
; 11 cm cars at speed smear into streaks with motion blur; off for readability (and comfort in MR).
r.DefaultFeature.MotionBlur=False

